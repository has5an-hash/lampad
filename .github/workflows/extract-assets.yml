name: Extract uploaded reference images

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Validate and extract archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import PurePosixPath, Path
          from zipfile import ZipFile
          import stat

          archive = Path("New folder.zip")
          if not archive.is_file():
              raise SystemExit("New folder.zip was not found")

          destination = Path("extracted")
          destination.mkdir(exist_ok=True)

          with ZipFile(archive) as zf:
              entries = zf.infolist()
              if len(entries) > 500:
                  raise SystemExit("Archive has too many entries")
              if sum(item.file_size for item in entries) > 80 * 1024 * 1024:
                  raise SystemExit("Uncompressed archive exceeds 80 MiB")

              for item in entries:
                  name = item.filename.replace("\\\\", "/")
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts or (path.parts and ":" in path.parts[0]):
                      raise SystemExit(f"Unsafe archive path: {item.filename!r}")
                  mode = (item.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f"Symbolic links are not allowed: {item.filename!r}")

              bad_entry = zf.testzip()
              if bad_entry:
                  raise SystemExit(f"Corrupt archive entry: {bad_entry}")

              zf.extractall(destination)

          files = [p for p in destination.rglob("*") if p.is_file()]
          print(f"Extracted {len(files)} files:")
          for item in files:
              print(f"{item} ({item.stat().st_size} bytes)")
          if not files:
              raise SystemExit("The archive contains no files")
          PY

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: gazaria-reference-images
          path: extracted/
          if-no-files-found: error
          retention-days: 3
