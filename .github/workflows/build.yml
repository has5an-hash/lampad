name: Build LemPad

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK + launch smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :android:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android/build/outputs/apk/debug/android-debug.apk
            adb logcat -c
            adb shell am force-stop app.lampad.remote
            adb shell monkey -p app.lampad.remote -c android.intent.category.LAUNCHER 1
            sleep 6
            adb logcat -d > android-launch-logcat.txt
            adb shell pidof app.lampad.remote | grep -q .
            adb shell dumpsys activity activities | grep -q "app.lampad.remote/.MainActivity"
            ! grep -Eq "FATAL EXCEPTION: main|Process: app\.lampad\.remote" android-launch-logcat.txt
            adb exec-out screencap -p > lampad-launch.png

      - name: Prepare APK
        run: cp android/build/outputs/apk/debug/android-debug.apk LemPad-v0.3.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LemPad-APK
          path: LemPad-v0.3.0-debug.apk
          if-no-files-found: error

      - name: Upload launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LemPad-Android-Launch-Diagnostics
          path: |
            android-launch-logcat.txt
            lampad-launch.png
          if-no-files-found: ignore

  windows:
    name: Windows Companion
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish companion
        shell: pwsh
        run: >
          dotnet publish windows/LemPad.Companion/LemPad.Companion.csproj
          -c Release
          -r win-x64
          --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/windows

      - name: Upload companion
        uses: actions/upload-artifact@v4
        with:
          name: LemPad-Windows
          path: publish/windows
          if-no-files-found: error
